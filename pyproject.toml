[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-tier-router"
version = "0.1.0"
description = "Provider-independent routing of user requests to model capability tiers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Model Router contributors"}]
keywords = ["llm", "routing", "model-selection", "ai", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "mypy>=1.11,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "twine>=5,<8",
]
demo = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
nlp = ["scikit-learn>=1.4,<2"]

[project.scripts]
model-router-demo = "model_router.demo_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_router = ["data/*.jsonl", "static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["model_router"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
